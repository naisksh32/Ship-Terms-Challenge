[project]
name = "llm-playground"
version = "0.1.0"
description = "A playground for experimenting with large language models (LLMs) using FastAPI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.116.1",
    "httpx>=0.28.1",
    "huggingface-hub>=0.24",
    "pydantic>=2",
    "python-dotenv>=1.1.1",
    "safetensors>=0.6.2",
    "tokenizers>=0.22.0",
    "transformers>=4.43",
    "uvicorn[standard]>=0.35.0",
]

[project.scripts]
llm-playground = "llm_playground:main"

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"
